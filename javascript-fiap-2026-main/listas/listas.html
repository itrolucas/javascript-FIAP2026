        <!DOCTYPE html>
        <html lang="en">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <link rel="stylesheet" href="style.css">
            <title>Document</title>
        </head>
        <body>
            <div class="principal">
                <h1>Lista Encadeada (versão simples)</h1>

                <input type="text" id="nome" placeholder="Digite um nome">
                <div class="content">
                <button onclick="adicionarFim()">Adicionar no fim</button>
                <button onclick="adicionarInicio()">Adicionar no início</button>
                <button onclick="removerInicio()">Remover início</button>
                <button onclick="contar()">Contar elementos</button>
                <button onclick="buscar()">Buscar nome</button>
                <button onclick="mostrar()">Mostrar lista</button>
                </div>

                
                <div id="saida"></div>
                <script>
                // "lista encadeada" simulada
                let valores = [];
                let proximo = [];

                let inicio = -1;
                let ultimo = -1;

                function adicionarFim() {
                    let nome = document.getElementById("nome").value;

                    if (nome === "") {
                        alert("Digite um nome");
                        return;
                    }

                    let novoIndice = valores.length;
                    valores.push(nome);
                    proximo.push(-1);

                    if (inicio === -1){
                        inicio = novoIndice;
                        ultimo = novoIndice;
                    } else {
                        proximo[ultimo] = novoIndice;
                        ultimo = novoIndice;
                    }

                    document.getElementById("nome").value = "";
                    document.getElementById("saida").innerHTML = "Elemento adicionado";
                }
                function adicionarInicio() {
                    let nome = document.getElementById("nome").value;

                    if (nome === "") {
                        alert("Digite um nome");
                        return;
                    }

                    let novoIndice = valores.length;
                    valores.push(nome);
                    proximo.push(inicio);
                    inicio = novoIndice;

                    if (ultimo === -1) {
                        ultimo = novoIndice;
                    }
                    document.getElementById("nome").value = ""
                    mostrar();
                }

                function removerInicio() {
                    if (inicio === -1) {
                        alert("lista vazia");
                        return;
                    }

                    inicio = proximo[inicio];

                    if (inicio === -1) {
                        ultimo = -1;
                    }
                    mostrar();
                }

                function contar() {
                    let quantidade = 0;
                    let atual = inicio;
                    while (atual !== -1) {
                        quantidade++;
                        atual = proximo[atual];
                    }
                    document.getElementById("saida").innerHTML = "Quantidade de elementos: "
                    + quantidade;
                }

                function mostrar() {
                    let resultado = "";
                    let atual = inicio;

                    if (inicio === -1) {
                        resultado = "Lista vazia";
                    }

                    while (atual !== -1) {
                        resultado += valores[atual] + " → ";
                        atual = proximo[atual];
                    }

                    resultado += "null";
                    document.getElementById("saida").innerHTML = resultado;
                }
            </script>
            </div>
        </body>
        </html>
